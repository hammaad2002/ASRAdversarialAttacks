[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-attacks"
version = "0.2.0"
description = "White-box adversarial attacks for CTC automatic speech recognition models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Hammad Ali Khan", email = "114487807+hammaad2002@users.noreply.github.com" },
]
keywords = ["asr", "adversarial-attacks", "speech", "robustness", "wav2vec2", "ctc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22",
    "torch>=2.0",
    "tqdm>=4.64",
    "jiwer>=3.0",
    "librosa>=0.10",
    "scipy>=1.10",
]

[project.optional-dependencies]
hf = ["transformers>=4.30"]
wav2vec2 = ["torchaudio>=2.0"]
rooms = ["pyroomacoustics>=0.7"]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "pre-commit>=3.5",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
build = [
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/hammaad2002/ASRAdversarialAttacks"
Documentation = "https://hammaad2002.github.io/ASRAdversarialAttacks/"
Changelog = "https://github.com/hammaad2002/ASRAdversarialAttacks/blob/main/CHANGELOG.md"
Issues = "https://github.com/hammaad2002/ASRAdversarialAttacks/issues"
Source = "https://github.com/hammaad2002/ASRAdversarialAttacks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asr_attacks = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"AdversarialAttacks.py" = ["F401"]
