site_name: asr-attacks
site_description: Test an ASR model against well-known white-box adversarial attacks.
site_url: https://hammaad2002.github.io/ASRAdversarialAttacks/
repo_url: https://github.com/hammaad2002/ASRAdversarialAttacks
repo_name: hammaad2002/ASRAdversarialAttacks
edit_uri: edit/main/docs/
copyright: Copyright 2023-2026 Hammad Ali Khan

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Get started:
      - Installation: install.md
      - Quickstart: quickstart.md
  - User guide:
      - Backends: guide/backends.md
      - Attacks: guide/attacks.md
      - Metrics: guide/metrics.md
      - ASRAttacks: guide/asr-attacks.md
      - Algorithms: guide/algorithms.md
      - Benchmark: guide/benchmark.md
      - Responsible use: guide/ethics.md
  - API:
      - ASRAttacker: api/attacker.md
      - Backends: api/backends.md
      - Attacks: api/attacks.md
      - Metrics: api/metrics.md
      - ASRAttacks: api/compat.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Publishing to PyPI: publishing.md
